<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Part 1 - Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
    body {
      background-color: #c9a1d5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .form-card {
      background: #ccb2b2;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
    }
    .form-card h2 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #333;
      text-align: center;
    }
    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #555;
    }
    .form-group input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 14px;
    }
    .form-group input.invalid {
      border-color: #e74c3c;
    }
    .error-message {
      color: #e74c3c;
      font-size: 12px;
      margin-top: 5px;
      display: block;
      min-height: 15px;
    }
    button[type="submit"] {
      width: 100%;
      padding: 12px;
      background-color: #da9be3;
      border: none;
      border-radius: 4px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button[type="submit"]:hover {
      background-color: #b8759d;
    }
    .success-message {
      color: #2ecc71;
      text-align: center;
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="form-card">
    <h2>Register</h2>
    <form id="registrationForm" novalidate>
      
      <!-- Name -->
      <div class="form-group">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="John Doe">
        <span class="error-message" id="nameError"></span>
      </div>

      <!-- Email -->
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="example@domain.com">
        <span class="error-message" id="emailError"></span>
      </div>

      <!-- Password -->
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="At least 8 characters">
        <span class="error-message" id="passwordError"></span>
      </div>

      <!-- Confirm Password -->
      <div class="form-group">
        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" placeholder="Re-enter password">
        <span class="error-message" id="confirmPasswordError"></span>
      </div>

      <!-- Age -->
      <div class="form-group">
        <label for="age">Age</label>
        <input type="number" id="age" placeholder="e.g. 25">
        <span class="error-message" id="ageError"></span>
      </div>

      <button type="submit">Submit</button>
      <div id="successMsg" class="success-message"></div>
    </form>
  </div>

  <script>
    const form = document.getElementById('registrationForm');
    const nameInput = document.getElementById('name');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const ageInput = document.getElementById('age');

    function showError(input, errorElement, message) {
      input.classList.add('invalid');
      errorElement.textContent = message;
    }

    function clearError(input, errorElement) {
      input.classList.remove('invalid');
      errorElement.textContent = '';
    }

    function validateName() {
      const val = nameInput.value.trim();
      const err = document.getElementById('nameError');
      if (val === '') {
        showError(nameInput, err, 'Name is required.');
        return false;
      }
      clearError(nameInput, err);
      return true;
    }

    function validateEmail() {
      const val = emailInput.value.trim();
      const err = document.getElementById('emailError');
      const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
      if (val === '') {
        showError(emailInput, err, 'Email is required.');
        return false;
      } else if (!emailRegex.test(val)) {
        showError(emailInput, err, 'Please enter a valid email address.');
        return false;
      }
      clearError(emailInput, err);
      return true;
    }

    function validatePassword() {
      const val = passwordInput.value;
      const err = document.getElementById('passwordError');
      if (val.length < 8) {
        showError(passwordInput, err, 'Password must be at least 8 characters.');
        return false;
      }
      clearError(passwordInput, err);
      return true;
    }

    function validateConfirmPassword() {
      const val = confirmPasswordInput.value;
      const passVal = passwordInput.value;
      const err = document.getElementById('confirmPasswordError');
      if (val === '') {
        showError(confirmPasswordInput, err, 'Please confirm your password.');
        return false;
      } else if (val !== passVal) {
        showError(confirmPasswordInput, err, 'Passwords do not match.');
        return false;
      }
      clearError(confirmPasswordInput, err);
      return true;
    }

    function validateAge() {
      const val = ageInput.value.trim();
      const ageNum = Number(val);
      const err = document.getElementById('ageError');
      if (val === '') {
        showError(ageInput, err, 'Age is required.');
        return false;
      } else if (isNaN(ageNum) || ageNum < 18 || ageNum > 120) {
        showError(ageInput, err, 'Age must be between 18 and 120.');
        return false;
      }
      clearError(ageInput, err);
      return true;
    }

    // Attach real-time input event listeners
    nameInput.addEventListener('input', validateName);
    emailInput.addEventListener('input', validateEmail);
    passwordInput.addEventListener('input', validatePassword);
    confirmPasswordInput.addEventListener('input', validateConfirmPassword);
    ageInput.addEventListener('input', validateAge);

    // Form submission validation
    form.addEventListener('submit', function(event) {
      event.preventDefault();

      const isNameValid = validateName();
      const isEmailValid = validateEmail();
      const isPasswordValid = validatePassword();
      const isConfirmPasswordValid = validateConfirmPassword();
      const isAgeValid = validateAge();

      if (isNameValid && isEmailValid && isPasswordValid && isConfirmPasswordValid && isAgeValid) {
        document.getElementById('successMsg').textContent = 'Form submitted successfully!';
      } else {
        document.getElementById('successMsg').textContent = '';
      }
    });
  </script>
</body>
</html>
